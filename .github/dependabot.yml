version: 2
updates:
  # ── Rust workspace ──────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── Visual IDE (React + Vite) ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/visual-ide"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      ide-minor-patch:
        update-types:
          - minor
          - patch

  # ── VS Code extension ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/vscode-xazz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"