name: Feature request
description: Propose a new capability or an improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check `docs/ROADMAP.md` — the idea may already be
        tracked as a `scale:*` / `genai:*` issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Xazz to do? Include `.xzz` syntax sketches if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Language / syntax
        - Compiler / IR
        - Execution / engines
        - Security / privacy
        - ML / deep learning
        - Server / API
        - Visual IDE
        - Tooling / ecosystem
        - Documentation
    validations:
      required: true